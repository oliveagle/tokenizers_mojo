[workspace]
name = "tokenizers-mojo"
version = "0.0.1"
description = "Mojo port of HuggingFace Tokenizers"
authors = ["oliveagle"]
license = "Apache-2.0"
readme = "README.md"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

# Mojo 1.0.0+ is expected on PATH (system-installed). Pixi only manages
# the project metadata and task aliases; the Mojo toolchain itself lives
# outside of pixi.

[tasks]
# Type-check the entire library (Mojo 1.0.0 has no `mojo check`; we
# compile a module that imports every public module under src/).
check = "mojo build -I src src/typecheck.mojo -o /tmp/tokenizers_mojo_typecheck"
# Format the source tree
fmt   = "mojo format src tests examples"
# Run the test suite (standalone test programs; no `mojo test` runner in
# this Mojo build)
test  = "bash scripts/run_tests.sh"
# Run the GPT-2 minimal end-to-end example
example-gpt2 = "mojo run -I src examples/gpt2_minimal.mojo"
# Phase 3 performance benchmark (Mojo) vs Rust baseline:
#   pixi run bench            # Mojo encodes/sec
#   python3 scripts/bench_rust.py   # Rust/HF baseline
bench = "mojo run -I src -I tests examples/bench.mojo"
